name: Validar Pull Requests

on:
  pull_request:
    branches:
      - QA
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  # ============================================================
  # TRABAJO 1: VALIDAR Y COMPILAR EN LA COMPUTADORA DE DEISY
  # ============================================================
  validar-pull-request:
    name: Validar flujo y proyecto

    # Envía este trabajo al runner autohospedado DEISY
    runs-on:
      - self-hosted
      - windows
      - x64

    # Evita ejecutar Pull Requests provenientes de forks externos
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      # --------------------------------------------------------
      # Mostrar que este trabajo se ejecuta en DEISY
      # --------------------------------------------------------
      - name: Mostrar información del runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Runner utilizado: $env:RUNNER_NAME"
          Write-Host "Sistema operativo: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:RUNNER_ARCH"
          Write-Host "Carpeta de trabajo: $env:GITHUB_WORKSPACE"
          Write-Host "=========================================="

      # --------------------------------------------------------
      # Validar las ramas de origen y destino
      # --------------------------------------------------------
      - name: Validar ramas permitidas
        shell: powershell
        env:
          RAMA_ORIGEN: ${{ github.head_ref }}
          RAMA_DESTINO: ${{ github.base_ref }}
        run: |
          Write-Host "Rama de origen: $env:RAMA_ORIGEN"
          Write-Host "Rama de destino: $env:RAMA_DESTINO"

          # QA solamente acepta ramas feature/*
          if ($env:RAMA_DESTINO -eq "QA") {
            if ($env:RAMA_ORIGEN -like "feature/*") {
              Write-Host "Flujo permitido: $env:RAMA_ORIGEN hacia QA"
              exit 0
            }

            throw "QA solamente acepta Pull Requests desde feature/*."
          }

          # main solamente acepta cambios desde QA
          if ($env:RAMA_DESTINO -eq "main") {
            if ($env:RAMA_ORIGEN -eq "QA") {
              Write-Host "Flujo permitido: QA hacia main"
              exit 0
            }

            throw "main solamente acepta Pull Requests desde QA."
          }

          throw "Flujo de ramas no permitido."

      # --------------------------------------------------------
      # Descargar el código del Pull Request en el runner
      # --------------------------------------------------------
      - name: Descargar código del Pull Request
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1

      # --------------------------------------------------------
      # Configurar Node.js en la computadora de Deisy
      # --------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      # --------------------------------------------------------
      # Mostrar las versiones utilizadas
      # --------------------------------------------------------
      - name: Mostrar versiones de Node y npm
        shell: powershell
        run: |
          node --version
          npm --version

      # --------------------------------------------------------
      # Descargar e instalar las dependencias
      # --------------------------------------------------------
      - name: Instalar dependencias
        shell: powershell
        run: |
          npm ci

      # --------------------------------------------------------
      # Revisar errores de código
      # --------------------------------------------------------
      - name: Ejecutar ESLint
        shell: powershell
        run: |
          npm run lint --if-present

      # --------------------------------------------------------
      # Compilar el proyecto Next.js
      # --------------------------------------------------------
      - name: Compilar proyecto
        shell: powershell
        run: |
          npm run build

  # ============================================================
  # TRABAJO 2: DOCKERIZAR EN LA COMPUTADORA DE DEISY
  # ============================================================
  dockerizar-en-runner:
    name: Dockerizar en runner

    # Esperar a que la validación anterior termine correctamente
    needs:
      - validar-pull-request

    # Ejecutar Docker tanto en PR hacia QA como en PR hacia main
    if: ${{ needs.validar-pull-request.result == 'success' && (github.base_ref == 'QA' || github.base_ref == 'main') && github.event.pull_request.head.repo.full_name == github.repository }}


    # Envía este trabajo al mismo runner autohospedado
    runs-on:
      - self-hosted
      - windows
      - x64

    timeout-minutes: 20

    env:
      IMAGE_NAME: conectando-desaparecidos:qa-candidate
      CONTAINER_NAME: conectando-qa-runner
      TEST_PORT: 3001

    steps:
      # --------------------------------------------------------
      # Descargar nuevamente el código en el trabajo Docker
      # --------------------------------------------------------
      - name: Descargar código del Pull Request
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1

      # --------------------------------------------------------
      # Demostrar que Docker también se ejecuta en DEISY
      # --------------------------------------------------------
      - name: Mostrar información del runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Runner utilizado: $env:RUNNER_NAME"
          Write-Host "Sistema operativo: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:RUNNER_ARCH"
          Write-Host "Carpeta de trabajo: $env:GITHUB_WORKSPACE"
          Write-Host "=========================================="

      # --------------------------------------------------------
      # Confirmar que Docker Desktop y Docker Engine funcionan
      # --------------------------------------------------------
      - name: Comprobar Docker
        shell: powershell
        run: |
          Write-Host "Comprobando Docker Desktop..."
          docker version

          Write-Host "Comprobando Docker Engine..."
          docker info

      # --------------------------------------------------------
      # Eliminar un contenedor anterior con el mismo nombre
      # --------------------------------------------------------
      - name: Eliminar contenedor anterior
        shell: powershell
        run: |
          $contenedor = docker ps -aq `
            --filter "name=^/$env:CONTAINER_NAME$"

          if ($contenedor) {
            Write-Host "Eliminando contenedor anterior..."
            docker rm -f $env:CONTAINER_NAME
          }
          else {
            Write-Host "No existe un contenedor anterior."
          }

      # --------------------------------------------------------
      # Construir la imagen Docker
      # --------------------------------------------------------
      - name: Construir imagen Docker
        shell: powershell
        run: |
          Write-Host "Construyendo la imagen $env:IMAGE_NAME..."

          docker build `
            --tag $env:IMAGE_NAME `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "No fue posible construir la imagen Docker."
          }

          Write-Host "La imagen fue construida correctamente."
          docker image inspect $env:IMAGE_NAME

      # --------------------------------------------------------
      # Crear y ejecutar el contenedor temporal
      # --------------------------------------------------------
      - name: Ejecutar contenedor temporal
        shell: powershell
        run: |
          Write-Host "Creando el contenedor $env:CONTAINER_NAME..."

          docker run `
            --detach `
            --name $env:CONTAINER_NAME `
            --publish "127.0.0.1:${env:TEST_PORT}:3000" `
            $env:IMAGE_NAME

          if ($LASTEXITCODE -ne 0) {
            throw "No fue posible iniciar el contenedor."
          }

          Write-Host "Contenedor iniciado correctamente."
          docker ps --filter "name=$env:CONTAINER_NAME"

      # --------------------------------------------------------
      # Comprobar que Next.js responda con HTTP 200
      # --------------------------------------------------------
      - name: Comprobar que la aplicación responda
        shell: powershell
        run: |
          $url = "http://localhost:${env:TEST_PORT}"
          $aplicacionLista = $false

          for ($intento = 1; $intento -le 12; $intento++) {
            try {
              Write-Host "Intento ${intento}: comprobando $url"

              $respuesta = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 10

              Write-Host "Código HTTP recibido: $($respuesta.StatusCode)"

              if ($respuesta.StatusCode -eq 200) {
                Write-Host "La aplicación responde correctamente."
                $aplicacionLista = $true
                break
              }
            }
            catch {
              Write-Host "La aplicación todavía no responde."

              if ($intento -lt 12) {
                Start-Sleep -Seconds 5
              }
            }
          }

          if (-not $aplicacionLista) {
            Write-Host "La aplicación no respondió correctamente."
            docker logs $env:CONTAINER_NAME
            throw "Falló la comprobación HTTP del contenedor."
          }

      # --------------------------------------------------------
      # Mostrar la imagen creada
      # --------------------------------------------------------
      - name: Mostrar imagen Docker creada
        shell: powershell
        run: |
          Write-Host "Imagen generada por la pipeline:"
          docker images conectando-desaparecidos

      # --------------------------------------------------------
      # Mostrar los logs y eliminar el contenedor temporal
      # Se ejecuta incluso cuando una prueba falla
      # --------------------------------------------------------
      - name: Mostrar logs y limpiar contenedor
        if: always()
        shell: powershell
        run: |
          $contenedor = docker ps -aq `
            --filter "name=^/$env:CONTAINER_NAME$"

          if ($contenedor) {
            Write-Host "=========================================="
            Write-Host "Logs del contenedor:"
            Write-Host "=========================================="

            docker logs $env:CONTAINER_NAME

            Write-Host "=========================================="
            Write-Host "Eliminando contenedor temporal..."
            Write-Host "=========================================="

            docker rm -f $env:CONTAINER_NAME
          }
          else {
            Write-Host "No existe un contenedor para limpiar."
          }