name: Validar Pull Request hacia main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validar-rama-origen:
    name: Validar rama de origen
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar información del Pull Request
        run: |
          echo "Rama de origen: ${{ github.head_ref }}"
          echo "Rama de destino: ${{ github.base_ref }}"

      - name: Permitir solamente develop o QA
        shell: bash
        run: |
          if [[ "${{ github.head_ref }}" == "develop" || "${{ github.head_ref }}" == "QA" ]]; then
            echo "Rama permitida: ${{ github.head_ref }}"
            exit 0
          fi

          echo "ERROR: main solamente acepta Pull Requests desde develop o QA."
          exit 1